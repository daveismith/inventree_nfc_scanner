# On a version tag (v1.2.3, or v1.2.3-rc.1 for a pre-release): build the production
# configuration and publish a GitHub release with the app image, a merged image and the
# manifest the InvenTree plugin reads. The tag must match version.txt.
#
# Actions are pinned by commit hash; the comment after each is the release it maps to.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and package
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
          python tools/make_release.py --tag "$GITHUB_REF_NAME" --git-sha "$GITHUB_SHA" --out dist
      - name: Keep the assets for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag --generate-notes "${flags[@]}"
