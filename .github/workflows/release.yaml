# On a version tag (v1.2.3, or v1.2.3-rc.1 for a pre-release): build the production
# configuration and publish a GitHub release with the app image, a merged image and the
# manifest the InvenTree plugin reads. The tag must match version.txt. The release also
# carries the simulator (host_sim) of that version for x86_64 and arm64 Linux,
# inventree_nfc_scanner-<version>-sim-linux-<cpu>, which the plugin's tests run against.
#
# Actions are pinned by commit hash; the comment after each is the release it maps to.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    container:
      # Google's mirror of Docker Hub: no Docker Hub pull limits.
      image: mirror.gcr.io/espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and package
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
          python tools/make_release.py --tag "$GITHUB_REF_NAME" --git-sha "$GITHUB_SHA" --out dist
      - name: Keep the assets for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  sim:
    name: Simulator (${{ matrix.cpu }})
    strategy:
      matrix:
        include:
          - cpu: x86_64
            runner: ubuntu-26.04
          - cpu: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: mirror.gcr.io/espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          CPU: ${{ matrix.cpu }}
        run: |
          . "$IDF_PATH/export.sh"
          (cd host_sim && idf.py --preview set-target linux build)
          mkdir -p dist
          cp host_sim/build/host_sim.elf "dist/inventree_nfc_scanner-${TAG#v}-sim-linux-$CPU"
      - name: Keep it for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sim-${{ matrix.cpu }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish
    needs: [build, sim]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Fetch the assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # All of them: the release's files and the simulators, into one directory.
          merge-multiple: true
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag --generate-notes "${flags[@]}"
