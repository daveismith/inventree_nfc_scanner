# Builds the firmware in both configurations and runs everything that needs no board (tests/,
# in pytest): the host unit tests, the simulator driven through nfcprog.py, the network link
# against the fake plugin, and the release packaging. Results are published as one check run.
# The simulator (host_sim) is kept as an artifact for each CPU, for the InvenTree plugin's
# tests to run against the firmware's own code (its docs/test-suite-plan.md, step 5).
#
# Actions are pinned by commit hash; the comment after each is the release it maps to.

name: CI

# Pull requests, and main once merged: a branch with a pull request would otherwise run
# twice, for the push and for the pull request. Any other branch: Actions → Run workflow.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware (ESP32-S3)
    runs-on: ubuntu-26.04
    container:
      # Google's mirror of Docker Hub: no Docker Hub pull limits.
      image: mirror.gcr.io/espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, production configuration
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
          grep -q 'CONFIG_APP_DEV_RECOVERY=y' sdkconfig && { echo "::error::the recovery guard is on in the production build"; exit 1; }
          grep -q 'CONFIG_APP_NET_ALLOW_HTTP=y' sdkconfig && { echo "::error::http is allowed in the production build"; exit 1; }
          grep -q 'CONFIG_APP_USB_TOUCH_1200=y' sdkconfig && { echo "::error::the 1200 baud touch is on in the production build"; exit 1; }
          echo "production image: $(stat -c %s build/inventree_nfc_scanner.bin) bytes"
          python tools/make_release.py --git-sha "$GITHUB_SHA" --out dist
      - name: Build, development configuration
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-dev -DSDKCONFIG=build-dev/sdkconfig -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.dev" build
          grep -q 'CONFIG_APP_DEV_RECOVERY=y' build-dev/sdkconfig
          grep -q 'CONFIG_APP_NET_ALLOW_HTTP=y' build-dev/sdkconfig
          grep -q 'CONFIG_APP_USB_TOUCH_1200=y' build-dev/sdkconfig

  host:
    name: Host tests and simulator
    runs-on: ubuntu-26.04
    container:
      # Google's mirror of Docker Hub: no Docker Hub pull limits.
      image: mirror.gcr.io/espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the unit tests and the simulator (linux target)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          (cd host_test && idf.py --preview set-target linux build)
          (cd host_sim && idf.py --preview set-target linux build)
      - name: Test
        # tests/: the unit tests one by one, the simulator driven through nfcprog.py, the
        # network link against tools/fake_plugin.py, and tools/make_release.py.
        shell: bash
        env:
          REQUIRE_BUILDS: "1"
        run: |
          . "$IDF_PATH/export.sh"
          pip install -r tests/requirements.txt
          python -m pytest --junitxml=test-results/junit-host-x86_64.xml -o junit_suite_name="host, x86_64"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-x86_64
          path: test-results/
          retention-days: 14
      - name: Keep the simulator
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-sim-linux-x86_64
          path: host_sim/build/host_sim.elf
          if-no-files-found: error

  sim-arm64:
    # The same simulator for arm64 Linux: what a test container runs on an Apple Silicon Mac.
    name: Simulator (arm64)
    runs-on: ubuntu-26.04-arm
    container:
      image: mirror.gcr.io/espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          (cd host_sim && idf.py --preview set-target linux build)
      - name: Test
        shell: bash
        env:
          REQUIRE_BUILDS: "1"
        run: |
          . "$IDF_PATH/export.sh"
          pip install -r tests/requirements.txt
          python -m pytest tests/test_sim.py --junitxml=test-results/junit-host-arm64.xml -o junit_suite_name="host, arm64"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-arm64
          path: test-results/
          retention-days: 14
      - name: Keep the simulator
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-sim-linux-arm64
          path: host_sim/build/host_sim.elf
          if-no-files-found: error

  report:
    # Every test, from both CPUs, as one check run on the commit (and a comment on a pull
    # request when results change); failures are also annotated on their lines.
    needs: [host, sim-arm64]
    if: always() && (needs.host.result != 'skipped' || needs.sim-arm64.result != 'skipped')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: test-results
          merge-multiple: true
      - name: Publish the results
        # A pull request from a fork gets a read-only token, which cannot create a check run.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          check_name: Test results
          files: test-results/junit-*.xml
          report_individual_runs: true
          comment_mode: ${{ github.event_name == 'pull_request' && 'changes' || 'off' }}
